# Extra local: frontend Streamlit do forecasting do Brent.
# Deploy oficial da disciplina: Streamlit Community Cloud.

services:
  brent:
    build: .
    image: brent-forecast:local
    container_name: brent-forecast
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
