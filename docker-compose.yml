# Extra local (MLOps): API FastAPI + frontend Streamlit.
# Deploy oficial da disciplina continua em https://avaliapeso.streamlit.app/

services:
  api:
    build: .
    image: avaliapeso:local
    container_name: avaliapeso-api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 25s

  avaliapeso:
    build: .
    image: avaliapeso:local
    container_name: avaliapeso
    ports:
      - "8501:8501"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
      INFERENCE_API_URL: http://host.docker.internal:8000
    depends_on:
      api:
        condition: service_healthy
